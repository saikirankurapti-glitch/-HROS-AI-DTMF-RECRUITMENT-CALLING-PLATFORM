name: hros
services:
  api:
    build: {context: ., dockerfile: server/Dockerfile}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      DATABASE_PATH: /data/hros.db
      ASTERISK_ARI_URL: http://asterisk:8088/ari
    ports: ["127.0.0.1:3001:3001"]
    volumes: ["hros_data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: {context: ., dockerfile: web/Dockerfile}
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 4
  asterisk:
    profiles: [sip]
    build: {context: ., dockerfile: asterisk/Dockerfile}
    restart: unless-stopped
    env_file: .env
    volumes: ["./asterisk/sounds:/var/lib/asterisk/sounds/hros:ro"]
    ports:
      - "127.0.0.1:5060:5060/udp"
      - "127.0.0.1:10000-10020:10000-10020/udp"
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  hros_data:
