name: HROS CI
on:
  push:
    branches: [main, feat/hros-mvp]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies and generate lockfile
        run: npm install --no-audit --no-fund
      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/hros-mvp'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: commit resolved npm lockfile'
            git push
          fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit and API tests
        run: npm test
      - name: Build production bundles
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run e2e --workspace=web
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hros-web-dist
          path: web/dist
          if-no-files-found: ignore
