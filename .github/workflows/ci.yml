name: HROS CI
on:
  push:
    branches: [main, feat/hros-mvp]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies and generate lockfile
        run: npm install --no-audit --no-fund
      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/hros-mvp'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: commit resolved npm lockfile'
            git push
          fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit and API tests
        run: npm test
      - name: Build production bundles
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run e2e --workspace=web
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hros-web-dist
          path: web/dist
          if-no-files-found: ignore

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure safe mock-only test environment
        run: |
          cp .env.example .env
          sed -i 's/^HROS_PASSWORD=.*/HROS_PASSWORD=ci-only-local-password/' .env
          sed -i 's/^SESSION_SECRET=.*/SESSION_SECRET=ci-only-32-characters-secret-change-me/' .env
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build and start mock services
        run: docker compose up --build -d api web
      - name: Verify HTTP health and UI
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health && curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs --tail=150 api web
          exit 1
      - name: Print status
        if: always()
        run: docker compose ps
      - name: Stop containers
        if: always()
        run: docker compose down -v
